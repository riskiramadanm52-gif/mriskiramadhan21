        /* Custom Styling for Canvas and Shake Effects */
        body {
            touch-action: manipulation;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            user-select: none;
            -webkit-user-select: none;
        }

        .font-display {
            font-family: 'Outfit', sans-serif;
        }

        /* Glassmorphism containers */
        .glass-panel {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .glass-button {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.15s ease;
        }

        .glass-button:active {
            transform: scale(0.94);
            background: rgba(255, 255, 255, 0.25);
        }

        /* Keypad press animation */
        .numpad-btn {
            box-shadow: 0 4px 0 rgba(0,0,0,0.3);
        }
        .numpad-btn:active {
            box-shadow: 0 0 0 rgba(0,0,0,0);
            transform: translateY(4px);
        }

        /* Animations */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-12px); }
            40%, 80% { transform: translateX(12px); }
        }
        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }

        @keyframes popSuccess {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: popSuccess 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Canvas Particle Layer */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 50;
        }

        /* Custom Scrollbar for modest usage */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 9999px;
        }
    </style>

        // --- Web Audio API Synthesizer (No external sound files required) ---
        class SoundEffects {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
            }

            playCorrect() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.1); // E5
                osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.2); // G5
                
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                
                osc.start(now);
                osc.stop(now + 0.3);
            }

            playWrong() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now); // A3
                osc.frequency.linearRampToValueAtTime(130, now + 0.25); // C3
                
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                
                osc.start(now);
                osc.stop(now + 0.25);
            }

            playGameOver() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.linearRampToValueAtTime(200, now + 0.5);
                
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                
                osc.start(now);
                osc.stop(now + 0.6);
            }
        }

        const soundFX = new SoundEffects();

        // --- Particle System (Confetti / Canvas Effects) ---
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 8 + 4;
                this.speedX = (Math.random() - 0.5) * 12;
                this.speedY = (Math.random() - 0.7) * 12;
                this.color = `hsl(${Math.random() * 360}, 100%, 60%)`;
                this.gravity = 0.4;
                this.alpha = 1;
                this.decay = Math.random() * 0.02 + 0.015;
            }

            update() {
                this.speedY += this.gravity;
                this.x += this.speedX;
                this.y += this.speedY;
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function triggerConfetti() {
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2 - 50;
            for (let i = 0; i < 40; i++) {
                particles.push(new Particle(centerX, centerY));
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // --- Game State Variables ---
        let currentMode = 'easy';
        let num1 = 0;
        let num2 = 0;
        let correctAnswer = 0;
        let userAnswer = '';
        let score = 0;
        let streak = 0;
        let maxStreak = 0;
        let totalQuestions = 0;
        let correctQuestions = 0;
        let timeLeft = 60;
        let totalTime = 60;
        let timerInterval = null;
        let highScore = localStorage.getItem('math_quest_highscore') || 0;

        // UI Element References
        const startScreen = document.getElementById('startScreen');
        const gameplayScreen = document.getElementById('gameplayScreen');
        const resultModal = document.getElementById('resultModal');
        const modalContent = document.getElementById('modalContent');
        const scoreText = document.getElementById('scoreText');
        const streakText = document.getElementById('streakText');
        const timerText = document.getElementById('timerText');
        const userAnswerText = document.getElementById('userAnswerText');
        const feedbackText = document.getElementById('feedbackText');
        const questionCard = document.getElementById('questionCard');
        const progressBar = document.getElementById('progressBar');
        const highScoreText = document.getElementById('highScoreText');
        const soundToggleBtn = document.getElementById('soundToggleBtn');
        const soundIcon = document.getElementById('soundIcon');
        const modeIndicator = document.getElementById('modeIndicator');

        // Init High Score Display
        highScoreText.textContent = highScore;

        // Toggle Sound Mute
        soundToggleBtn.addEventListener('click', () => {
            soundFX.muted = !soundFX.muted;
            if (soundFX.muted) {
                soundIcon.className = 'fas fa-volume-mute text-rose-400';
            } else {
                soundIcon.className = 'fas fa-volume-up text-yellow-400';
                soundFX.playCorrect();
            }
        });

        document.getElementById('homeBtn').addEventListener('click', () => {
            if (!gameplayScreen.classList.contains('hidden')) {
                if (confirm('Apakah kamu yakin ingin keluar ke menu utama?')) {
                    endGame();
                    closeModalAndGoHome();
                }
            }
        });

        // --- Game Logic Functions ---
        function startGame(mode) {
            currentMode = mode;
            score = 0;
            streak = 0;
            maxStreak = 0;
            totalQuestions = 0;
            correctQuestions = 0;
            userAnswer = '';

            // Mode Configurations
            if (mode === 'easy') {
                totalTime = 45;
                modeIndicator.textContent = 'Mode: Mudah (1 Digit)';
            } else if (mode === 'medium') {
                totalTime = 60;
                modeIndicator.textContent = 'Mode: Sedang (2 Digit)';
            } else if (mode === 'hard') {
                totalTime = 60;
                modeIndicator.textContent = 'Mode: Sulit (3 Digit)';
            } else if (mode === 'rush') {
                totalTime = 20;
                modeIndicator.textContent = 'Mode: Speed Rush';
            }

            timeLeft = totalTime;
            
            // Update UI
            updateStatsUI();
            startScreen.classList.add('hidden');
            gameplayScreen.classList.remove('hidden');

            generateQuestion();
            startTimer();
        }

        function generateQuestion() {
            userAnswer = '';
            userAnswerText.textContent = '';
            
            if (currentMode === 'easy') {
                num1 = Math.floor(Math.random() * 9) + 1;
                num2 = Math.floor(Math.random() * 9) + 1;
            } else if (currentMode === 'medium') {
                num1 = Math.floor(Math.random() * 90) + 10;
                num2 = Math.floor(Math.random() * 90) + 10;
            } else if (currentMode === 'hard') {
                num1 = Math.floor(Math.random() * 900) + 100;
                num2 = Math.floor(Math.random() * 900) + 100;
            } else if (currentMode === 'rush') {
                // Mix of digits in speed rush
                const isTwoDigit = Math.random() > 0.4;
                num1 = isTwoDigit ? Math.floor(Math.random() * 40) + 10 : Math.floor(Math.random() * 9) + 1;
                num2 = isTwoDigit ? Math.floor(Math.random() * 40) + 10 : Math.floor(Math.random() * 9) + 1;
            }

            correctAnswer = num1 + num2;

            document.getElementById('num1').textContent = num1;
            document.getElementById('num2').textContent = num2;

            // Trigger Pop animation on card
            questionCard.classList.remove('animate-pop');
            void questionCard.offsetWidth; // Force reflow
            questionCard.classList.add('animate-pop');
        }

        function pressNumpad(val) {
            if (userAnswer.length < 5) {
                userAnswer += val;
                userAnswerText.textContent = userAnswer;
            }
        }

        function clearAnswer() {
            userAnswer = userAnswer.slice(0, -1);
            userAnswerText.textContent = userAnswer;
        }

        function submitAnswer() {
            if (userAnswer === '') return;

            totalQuestions++;
            const numericUserAnswer = parseInt(userAnswer, 10);

            if (numericUserAnswer === correctAnswer) {
                // Correct Answer Logic
                correctQuestions++;
                streak++;
                if (streak > maxStreak) maxStreak = streak;

                // Points calculation based on difficulty and streak
                let basePoints = currentMode === 'easy' ? 10 : (currentMode === 'medium' ? 20 : 30);
                let streakBonus = Math.min(streak * 2, 20);
                score += basePoints + streakBonus;

                if (currentMode === 'rush') {
                    timeLeft = Math.min(timeLeft + 2, 30); // Add time bonus in rush
                }

                soundFX.playCorrect();
                triggerConfetti();
                showFeedback(`Benar! +${basePoints + streakBonus}`, 'text-emerald-400');
            } else {
                // Wrong Answer Logic
                streak = 0;
                soundFX.playWrong();
                
                // Shake effect on question card
                questionCard.classList.remove('animate-shake');
                void questionCard.offsetWidth;
                questionCard.classList.add('animate-shake');

                showFeedback(`Salah! Jawabannya: ${correctAnswer}`, 'text-rose-400');
            }

            updateStatsUI();
            generateQuestion();
        }

        function showFeedback(text, colorClass) {
            feedbackText.textContent = text;
            feedbackText.className = `h-6 text-sm font-bold opacity-100 transition-opacity duration-200 ${colorClass}`;
            setTimeout(() => {
                feedbackText.classList.remove('opacity-100');
                feedbackText.classList.add('opacity-0');
            }, 1200);
        }

        function updateStatsUI() {
            scoreText.textContent = score;
            streakText.textContent = `${streak}x`;
            timerText.textContent = `${timeLeft}s`;

            // Progress bar ratio
            const ratio = (timeLeft / totalTime) * 100;
            progressBar.style.width = `${Math.max(0, ratio)}%`;

            // Color timer warning
            if (timeLeft <= 10) {
                timerText.className = 'font-display text-xl sm:text-3xl font-extrabold text-rose-500 animate-pulse';
            } else {
                timerText.className = 'font-display text-xl sm:text-3xl font-extrabold text-emerald-400';
            }
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                updateStatsUI();

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    endGame();
                }
            }, 1000);
        }

        function endGame() {
            clearInterval(timerInterval);
            soundFX.playGameOver();

            // Save High Score
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('math_quest_highscore', highScore);
                highScoreText.textContent = highScore;
            }

            // Populate Modal Stats
            document.getElementById('finalScore').textContent = score;
            document.getElementById('finalStreak').textContent = `${maxStreak}x`;
            document.getElementById('finalCount').textContent = `${correctQuestions}/${totalQuestions}`;
            
            const accuracy = totalQuestions > 0 ? Math.round((correctQuestions / totalQuestions) * 100) : 0;
            document.getElementById('finalAccuracy').textContent = `${accuracy}%`;

            // Show Modal
            resultModal.classList.remove('hidden');
            setTimeout(() => {
                resultModal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
            }, 10);
        }

        function closeModalAndGoHome() {
            resultModal.classList.add('opacity-0');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');

            setTimeout(() => {
                resultModal.classList.add('hidden');
                gameplayScreen.classList.add('hidden');
                startScreen.classList.remove('hidden');
            }, 200);
        }

        function restartGame() {
            resultModal.classList.add('opacity-0');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');

            setTimeout(() => {
                resultModal.classList.add('hidden');
                startGame(currentMode);
            }, 200);
        }

        // --- Keyboard Input Handling for Laptop / PC Users ---
        document.addEventListener('keydown', (e) => {
            if (gameplayScreen.classList.contains('hidden')) return;

            if (e.key >= '0' && e.key <= '9') {
                pressNumpad(e.key);
            } else if (e.key === 'Enter') {
                submitAnswer();
            } else if (e.key === 'Backspace') {
                clearAnswer();
            }
        });
    </script>
</body>
</html>
